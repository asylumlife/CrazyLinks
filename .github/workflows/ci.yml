name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP (phpcs, phpstan, phpunit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crazylinks
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crazylinks_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@2.31.1
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: phpcs
        run: vendor/bin/phpcs

      - name: phpstan
        run: vendor/bin/phpstan analyse --no-progress

      # The install script cannot run unmodified on ubuntu runners: it uses
      # bsdtar-only `tar --include` flags (GNU tar rejects them) and `wp core
      # download` (PharData truncates paths over 100 chars, breaking
      # wp-includes/php-ai-client). So prepare both directories here with
      # the official zip and GNU tar patterns; the script then skips its own
      # downloads and only writes wp-tests-config.php and the database.
      - name: Install WordPress test library
        env:
          WP_VERSION: '7.1.4'
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/crazylinks-tests"
          mkdir -p "$T"
          curl -sSfL -o "$T/wordpress.zip" "https://wordpress.org/wordpress-${WP_VERSION}.zip"
          unzip -q "$T/wordpress.zip" -d "$T/unzip"
          mv "$T/unzip/wordpress" "$T/wordpress"
          mkdir -p "$T/wordpress/wp-content/plugins" "$T/wordpress/wp-content/themes" "$T/wordpress/wp-content/uploads"
          curl -sSfL "https://github.com/WordPress/wordpress-develop/archive/refs/tags/${WP_VERSION}.tar.gz" \
            | tar xz -C "$T" --wildcards \
              "wordpress-develop-${WP_VERSION}/tests/phpunit/includes/*" \
              "wordpress-develop-${WP_VERSION}/tests/phpunit/data/*" \
              "wordpress-develop-${WP_VERSION}/wp-tests-config-sample.php"
          mv "$T/wordpress-develop-${WP_VERSION}" "$T/develop"
          bin/install-wp-tests.sh crazylinks_test root root 127.0.0.1:3306 "$WP_VERSION" "$T"

      - name: phpunit
        env:
          WP_TESTS_DIR: ${{ runner.temp }}/crazylinks-tests/develop/tests/phpunit
        run: vendor/bin/phpunit

  js:
    name: JS (typecheck, lint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crazylinks
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crazylinks/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run test:unit
      - run: npm run build

      - name: Committed build matches source
        run: git diff --exit-code -- assets/build
